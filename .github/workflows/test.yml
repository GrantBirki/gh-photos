name: test

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

cache-mode: none

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: setup go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          cache: false

      - name: bootstrap
        run: script/bootstrap --skip-goreleaser

      - name: test
        run: script/test
